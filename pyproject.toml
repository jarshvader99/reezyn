[project]
name = "reezyn"
version = "0.2.5"
description = "A calm, local narrator for coding-agent reasoning."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "kokoro-onnx==0.6.1",
    "numpy>=1.26",
    "pyobjc-framework-applicationservices>=12.2.2",
    "pyobjc-framework-avfoundation>=12.2.2",
    "pyobjc-framework-quartz>=12.2.2",
    "pyobjc-framework-speech>=12.2.2",
    "rumps>=0.4.0",
    "sounddevice>=0.5",
]

[project.scripts]
reezyn = "reezyn.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["reezyn"]

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
