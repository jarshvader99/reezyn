[project]
name = "reezyn"
version = "0.1.0"
description = "A calm, local narrator for coding-agent reasoning."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "kokoro-onnx==0.6.1",
    "numpy>=1.26",
    "rumps>=0.4.0",
    "sounddevice>=0.5",
]

[project.scripts]
reezyn = "reezyn.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["reezyn"]

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
